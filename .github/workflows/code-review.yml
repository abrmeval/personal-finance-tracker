name: Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: OpenCode Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.2
          agent: code-reviewer
          use_github_token: true
          prompt: |
            Review this pull request against the Personal Finance Tracker guidelines.

            Scope:
            - Every file changed in this PR under `backend/`, `frontend/`, `docs/`, and `.github/`.
            - Apply the full backend, frontend, documentation, and CI/CD checklists from your system prompt.

            Requirements:
            - Read every mandatory reference file listed in your instructions before flagging any rule.
            - Each finding must cite: Severity, Category, Location (`file:line`), Rule violated, Description, How to fix.
            - "How to fix" must be actionable — show the corrected code or the exact change to make.
            - Do not flag issues that are not backed by a rule from `AGENTS.md` or `docs/`.
            - Do not modify any files. You are read-only.

            Post the structured report defined in your instructions as a single PR comment.