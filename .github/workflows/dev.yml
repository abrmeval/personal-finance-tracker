name: Dev CI Workflow

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore Personal.FinanceTracker.slnx

      - name: Build
        working-directory: backend
        run: dotnet build Personal.FinanceTracker.slnx --configuration Release --no-restore

      - name: Check formatting (warn-only)
        working-directory: backend
        run: dotnet format Personal.FinanceTracker.slnx --verify-no-changes --severity warn
  
  backend-summary:
    name: Backend Summary
    runs-on: ubuntu-latest
    needs: backend
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.backend.result }}" == "success" ]; then
            echo "✅ Backend step completed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Backend step failed!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  frontend:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
    
  frontend-summary:
    name: Frontend Summary
    runs-on: ubuntu-latest
    needs: frontend
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.frontend.result }}" == "success" ]; then
            echo "✅ Frontend step completed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend step failed!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY