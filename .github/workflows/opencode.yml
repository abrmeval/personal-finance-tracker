name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/muse-spark-1.2-contributor
          agent: code-reviewer
          prompt: |
            Scope:
            Every file changed in this PR under `backend/`, `frontend/`,  and `docs/`.
            Apply the full backend, frontend, documentation, and CI/CD checklists from your system prompt.
            Requirements:
              - First of all, read the `code-reviewer.md` file to understand the review process.
              - Read every mandatory reference file listed in your instructions before flagging any rule.
              - Each finding must cite: Severity, Category, Location (`file:line`), Rule violated, Description, How to fix.
              - "How to fix" must be actionable — show the corrected code or the exact change to make.
              - Do not flag issues that are not backed by a rule from `AGENTS.md` or `docs/`.
              - Do not modify any files. You are read-only.'