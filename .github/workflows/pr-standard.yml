name: PR Standards Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  check-pr-standards:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title and body
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || "";
            const body  = context.payload.pull_request.body  || "";

            const errors = [];
            const warnings = [];

            // ---------- TITLE CHECKS ----------

            // 1. Must start with "PR: ", optionally followed by an "[Area] " tag.
            //    Accepted: "PR: Title" or "PR: [Area] Title"
            const titleMatch = title.match(/^PR: (\[[^\]]+\] )?(.+)$/);
            if (!titleMatch) {
              errors.push(
                'Title must start with "PR: " (optionally followed by an area tag like "[Payments] "). ' +
                'Example: `PR: [Payments] Add retry logic to webhook handler`'
              );
            }

            const bareTitle = titleMatch ? titleMatch[2].trim() : title.trim();

            // 2. Max length (150 chars, full title including "PR: " and area tag)
            if (title.length > 150) {
              errors.push(`Title is ${title.length} characters long; the limit is 150.`);
            }

            // 3. Basic imperative-mood heuristic — flag common past-tense / gerund openers.
            //    This is a heuristic, not a grammar check, so it's a warning rather than a hard failure.
            const nonImperativeStarters = [
              'added', 'adding', 'fixed', 'fixing', 'updated', 'updating',
              'removed', 'removing', 'created', 'creating', 'changed', 'changing',
              'refactored', 'refactoring', 'implemented', 'implementing',
              'improved', 'improving', 'deleted', 'deleting', 'renamed', 'renaming'
            ];
            const firstWord = (bareTitle.split(/\s+/)[0] || '').toLowerCase();
            if (nonImperativeStarters.includes(firstWord)) {
              warnings.push(
                `Title looks like it may not use imperative mood ("${firstWord}"). ` +
                `Prefer e.g. "Add" instead of "Added"/"Adding".`
              );
            }

            // 4. Empty title after prefix
            if (titleMatch && bareTitle.length === 0) {
              errors.push('Title has no content after the "PR: " / area prefix.');
            }

            // ---------- BODY CHECKS ----------

            // Must contain a "# Summary" section and a "# Key Changes" section, in that order,
            // with the Key Changes section containing at least one bullet point.
            const summaryHeadingRe    = /^#{1,2}\s*Summary:?\s*$/im;
            const keyChangesHeadingRe = /^#{1,2}\s*Key Changes:?\s*$/im;

            const summaryMatch = body.match(summaryHeadingRe);
            const keyChangesMatch = body.match(keyChangesHeadingRe);

            if (!summaryMatch) {
              errors.push('Body is missing a "# Summary:" section.');
            }
            if (!keyChangesMatch) {
              errors.push('Body is missing a "# Key Changes:" section.');
            }

            if (summaryMatch && keyChangesMatch && summaryMatch.index > keyChangesMatch.index) {
              errors.push('The "Summary" section must come before the "Key Changes" section.');
            }

            // Extract Summary section content (between the Summary heading and the next heading)
            if (summaryMatch) {
              const afterSummary = body.slice(summaryMatch.index + summaryMatch[0].length);
              const nextHeading = afterSummary.search(/^#{1,2}\s*\S/m);
              const summaryText = (nextHeading === -1 ? afterSummary : afterSummary.slice(0, nextHeading))
                .replace(/^[\s\-*]+/gm, '') // strip leading bullets/dashes if used
                .trim();

              if (summaryText.length === 0) {
                errors.push('The "Summary" section is empty.');
              } else {
                const sentenceCount = (summaryText.match(/[.!?](\s|$)/g) || []).length || 1;
                if (sentenceCount > 3) {
                  warnings.push(`Summary looks long (~${sentenceCount} sentences); aim for 2-3 sentences max.`);
                }
              }
            }

            // Extract Key Changes section content and confirm at least one bullet point
            if (keyChangesMatch) {
              const afterKeyChanges = body.slice(keyChangesMatch.index + keyChangesMatch[0].length);
              const nextHeading = afterKeyChanges.search(/^#{1,2}\s*\S/m);
              const keyChangesText = nextHeading === -1 ? afterKeyChanges : afterKeyChanges.slice(0, nextHeading);

              const bulletCount = (keyChangesText.match(/^\s*[-*]\s+\S/gm) || []).length;
              if (bulletCount === 0) {
                errors.push('The "Key Changes" section must contain at least one bullet point (use "- " or "* ").');
              }
            }

            // ---------- REPORT ----------

            const passed = errors.length === 0;
            const lines = [];
            lines.push(passed ? '## ✅ PR Standards Check Passed' : '## ❌ PR Standards Check Failed');
            lines.push('');

            if (errors.length) {
              lines.push('**Errors (must fix):**');
              for (const e of errors) lines.push(`- ${e}`);
              lines.push('');
            }
            if (warnings.length) {
              lines.push('**Warnings (recommended):**');
              for (const w of warnings) lines.push(`- ${w}`);
              lines.push('');
            }
            if (passed && warnings.length === 0) {
              lines.push('Title and body both meet the required format. 🎉');
            }

            lines.push('---');
            lines.push('<details><summary>Expected format</summary>');
            lines.push('');
            lines.push('**Title:** `PR: [Area] Title in imperative mood` (Area is optional, 150 chars max)');
            lines.push('');
            lines.push('**Body:**');
            lines.push('```');
            lines.push('# Summary:');
            lines.push('- Brief summary of the changes made and their purpose');
            lines.push('');
            lines.push('# Key Changes:');
            lines.push('- Bullet point 1: Description of the first key change');
            lines.push('- Bullet point 2: Description of the second key change');
            lines.push('```');
            lines.push('</details>');

            const commentBody = lines.join('\n');

            // Find and update a previous check comment instead of spamming new ones.
            const marker = '<!-- pr-standards-check -->';
            const fullComment = `${marker}\n${commentBody}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullComment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: fullComment,
              });
            }

            if (!passed) {
              core.setFailed(`PR standards check failed:\n${errors.join('\n')}`);
            }
